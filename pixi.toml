[workspace]
name = "music-composer-classification-pytorch"
version = "0.1.0"
description = "Composer classification from symbolic MIDI using PyTorch"
authors = ["AAI-511 Group 6"]
channels = ["conda-forge"]
platforms = ["osx-arm64", "linux-64", "win-64"]

[dependencies]
python = ">=3.12,<3.13"
numpy = ">=1.26,<3"
pandas = ">=2.0,<3"
scikit-learn = ">=1.3,<2"
matplotlib = ">=3.7,<4"
seaborn = ">=0.13,<0.14"
pytorch = ">=2.5,<3"
ipykernel = ">=6.29,<7"
jupyterlab = ">=4,<5"
kaggle = ">=1.6,<2"
pytest = ">=8,<9"

[pypi-dependencies]
pretty_midi = ">=0.2.10,<0.3"

[tasks]
notebook = "jupyter lab"
prepare-dataset = "python src/prepare_dataset.py"
check-imports = "python -c \"import numpy, pandas, pretty_midi, sklearn, matplotlib, seaborn, torch; print(f'PyTorch {torch.__version__}; imports OK')\""
test = { cmd = "python -m pytest tests -q", env = { PYTHONPATH = "src" } }